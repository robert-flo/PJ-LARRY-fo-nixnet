<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="660" viewBox="0 0 1600 660" role="img" aria-labelledby="t d"><title id="t">Nixnet host identity continuity</title><desc id="d">A persistent Git-backed host identity passes from a retired virtual machine to a fresh replacement while configuration and history remain intact.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#07101a"/><stop offset="1" stop-color="#101827"/></linearGradient></defs><rect width="1600" height="660" rx="34" fill="url(#bg)"/><text x="90" y="105" fill="#778b9c" font-family="system-ui,sans-serif" font-size="24" letter-spacing="8">HOST IDENTITY OUTLIVES HARDWARE</text><text x="90" y="198" fill="#f1f6f8" font-family="system-ui,sans-serif" font-size="78" font-weight="250">NIXNET</text><g transform="translate(95 300)" font-family="system-ui,sans-serif"><rect width="350" height="215" rx="28" fill="#171b22" stroke="#5e6770" stroke-width="3"/><text x="175" y="58" text-anchor="middle" fill="#9ca5ab" font-size="21">OLD MACHINE</text><path d="M75 90h200v78H75z" fill="#202832" stroke="#65717c" stroke-width="2"/><path d="M120 185h110" stroke="#65717c" stroke-width="8"/><text x="175" y="207" text-anchor="middle" fill="#d25b5b" font-family="ui-monospace,monospace" font-size="17">dormant</text><rect x="620" width="350" height="215" rx="28" fill="#0d2828" stroke="#43d7b0" stroke-width="3"/><text x="795" y="58" text-anchor="middle" fill="#43d7b0" font-size="21">IDENTITY</text><g fill="#e9f6f3" font-family="ui-monospace,monospace" font-size="19"><text x="668" y="105">name: atlas</text><text x="668" y="139">history: preserved</text><text x="668" y="173">config: global + host</text></g><rect x="1240" width="350" height="215" rx="28" fill="#131a29" stroke="#7698ee" stroke-width="3"/><text x="1415" y="58" text-anchor="middle" fill="#9db5f5" font-size="21">NEW MACHINE</text><path d="M1315 90h200v78h-200z" fill="#17273a" stroke="#7698ee" stroke-width="2"/><path d="M1360 185h110" stroke="#7698ee" stroke-width="8"/><text x="1415" y="207" text-anchor="middle" fill="#43d7b0" font-family="ui-monospace,monospace" font-size="17">active</text></g><g stroke="#8c75dc" stroke-width="5" fill="none"><path d="M475 408h205"/><path d="m660 393 20 15-20 15"/><path d="M1065 408h205"/><path d="m1250 393 20 15-20 15"/></g><text x="800" y="595" text-anchor="middle" fill="#748899" font-family="ui-monospace,monospace" font-size="19">machines are replaceable · identity is durable · convergence is repeatable</text></svg>
